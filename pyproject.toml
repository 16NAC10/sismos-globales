[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sismos-globales"
version = "1.0.0"
description = "Obtención, procesamiento, almacenamiento y análisis de eventos sísmicos globales"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "confluent-kafka>=2.5",
    "pyspark==4.0.1",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "pymongo>=4.8",
    "streamlit>=1.38",
    "plotly>=5.24",
    "pydeck>=0.9",
]

[project.optional-dependencies]
pruebas = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sismos = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
