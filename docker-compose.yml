services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sismos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      # El topic conserva los mensajes para poder reprocesar bronze sin volver a consultar las APIs
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-datos:/var/lib/kafka/data

  mongo:
    image: mongo:7
    container_name: sismos-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-datos:/data/db

  # Ingesta, Spark (bronze/silver/gold) y carga en MongoDB. Corre en Linux, donde Spark escribe Parquet sin configuración extra.
  pipeline:
    build: .
    container_name: sismos-pipeline
    depends_on:
      - kafka
      - mongo
    environment:
      SISMOS_KAFKA_BOOTSTRAP: kafka:29092
      SISMOS_MONGO_URI: mongodb://mongo:27017
      SISMOS_SPARK_MEMORIA: 4g
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "sismos", "ciclo"]

  dashboard:
    build: .
    container_name: sismos-dashboard
    depends_on:
      - mongo
    environment:
      SISMOS_MONGO_URI: mongodb://mongo:27017
    ports:
      - "8501:8501"
    command: ["python", "-m", "streamlit", "run", "src/sismos/dashboard/app.py", "--server.address=0.0.0.0"]

volumes:
  kafka-datos:
  mongo-datos:
